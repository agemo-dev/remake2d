site_name: RE:MAKE 2D
site_description: A cross-plateform 2D engine
site_author: agemo-dev

theme:
  name: material
  palette:
    scheme:  slate
    primary: indigo
    accent:  cyan
  logo: assets/favicon.png
  favicon: assets/favicon.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.emoji:
      emoji_index:     !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - attr_list
  - md_in_html


nav:
  - Home:
    - About RE:MAKE 2D : home/about.md
    - Cheatsheet:        home/cheatsheet.md
  - Learn:
    - Introduction:
        - Installation & compilation: learn/introduction/install.md
